<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1220;
  --panel: #141a2f;
  --panel-soft: #1b2440;
  --text: #e8ecff;
  --muted: #9aa7d8;
  --accent: #6f8bff;
  --accent-2: #8a6fff;
  --border: #2b355a;
  --user: #2d6df6;
  --assistant: #212d4f;
  --danger: #ff6b6b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top left, #1a2250 0%, var(--bg) 45%, #0a0d19 100%);
  min-height: 100vh;
}

.app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

.sidebar {
  border-right: 1px solid var(--border);
  background: rgba(7, 10, 22, 0.75);
  backdrop-filter: blur(6px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand {
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge {
  font-size: 12px;
  color: var(--muted);
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  width: fit-content;
}

.secondaryBtn,
.primaryBtn {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel-soft);
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s ease;
}

.primaryBtn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border: none;
  font-weight: 600;
}

.secondaryBtn:hover,
.primaryBtn:hover { transform: translateY(-1px); }

.hint {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.main {
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(11, 14, 28, 0.55);
}

select {
  border: 1px solid var(--border);
  background: var(--panel-soft);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 10px;
}

.chatWindow {
  flex: 1;
  overflow-y: auto;
  padding: 26px 18px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 820px;
  width: fit-content;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.message.user {
  margin-left: auto;
  background: var(--user);
  border-color: transparent;
}

.message.assistant {
  background: var(--assistant);
}

.meta {
  display: block;
  color: #bec8ef;
  font-size: 11px;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.composer {
  padding: 14px 16px 18px;
  border-top: 1px solid var(--border);
  background: rgba(11, 14, 28, 0.75);
}

.inputWrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  max-width: 980px;
  margin: 0 auto;
}

textarea {
  flex: 1;
  resize: none;
  min-height: 56px;
  max-height: 180px;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 14px;
  font: inherit;
  color: var(--text);
  background: var(--panel);
}

textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(111, 139, 255, 0.2);
}

.notice {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}

.thinking {
  display: inline-flex;
  gap: 4px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #c9d2f8;
  animation: blink 1s infinite ease-in-out;
}

.dot:nth-child(2) { animation-delay: .15s; }
.dot:nth-child(3) { animation-delay: .3s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">✨ Nova AI</div>
    <div class="badge">ChatGPT-like demo UI</div>
    <button class="primaryBtn" id="newChatBtn">+ New Chat</button>
    <button class="secondaryBtn" id="clearBtn">Clear Conversation</button>
    <p class="hint">
      This is a front-end AI assistant mock. Responses are generated locally with simple logic so you can style and extend it like ChatGPT.
    </p>
  </aside>

  <section class="main">
    <div class="topbar">
      <strong>Assistant</strong>
      <select id="modelPicker" aria-label="Model Picker">
        <option>Nova-4</option>
        <option>Nova-4-mini</option>
        <option>Nova-Creative</option>
      </select>
    </div>

    <div id="chatWindow" class="chatWindow"></div>

    <div class="composer">
      <div class="inputWrap">
        <textarea id="promptInput" placeholder="Message Nova AI... (Enter to send, Shift+Enter for new line)"></textarea>
        <button class="primaryBtn" id="sendBtn">Send</button>
      </div>
      <div class="notice">AI can make mistakes. Verify important information.</div>
    </div>
  </section>
</div>

<script>
const chatWindow = document.getElementById('chatWindow');
const promptInput = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const newChatBtn = document.getElementById('newChatBtn');

const starter = "Hi! I am Nova AI, your helpful assistant. Ask me to explain concepts, draft text, brainstorm ideas, or write code.";

function addMessage(role, content, temporary = false) {
  const bubble = document.createElement('div');
  bubble.className = `message ${role}`;
  if (temporary) bubble.dataset.temporary = 'true';

  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = role === 'user' ? 'You' : 'Nova AI';

  const text = document.createElement('div');
  text.innerHTML = content;

  bubble.appendChild(meta);
  bubble.appendChild(text);
  chatWindow.appendChild(bubble);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return bubble;
}

function resetChat() {
  chatWindow.innerHTML = '';
  addMessage('assistant', starter);
}

function escapeHTML(value) {
  return value
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;');
}

function localAIResponse(input) {
  const text = input.toLowerCase();

  if (text.includes('hello') || text.includes('hi')) {
    return "Hello 👋 How can I help you today?";
  }

  if (text.includes('code')) {
    return "Sure — I can help with code. Share your language, goal, and any errors. I can provide a clean step-by-step fix.";
  }

  if (text.includes('explain')) {
    return "Absolutely. Tell me the exact topic and your current level (beginner/intermediate/advanced), and I will explain it clearly.";
  }

  if (text.includes('write') || text.includes('email') || text.includes('message')) {
    return "I can draft that. Tell me the tone, audience, and key points to include.";
  }

  return `Here is a helpful starting point:\n\n1) Clarify your goal.\n2) Share constraints (time, format, tools).\n3) I will generate a tailored response.\n\nYou said: “${escapeHTML(input).slice(0, 240)}”`;
}

async function sendMessage() {
  const text = promptInput.value.trim();
  if (!text) return;

  addMessage('user', escapeHTML(text));
  promptInput.value = '';
  autoSizeTextarea();

  const thinking = addMessage('assistant', '<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>', true);

  await new Promise((resolve) => setTimeout(resolve, 550));

  thinking.remove();
  addMessage('assistant', localAIResponse(text));
}

function autoSizeTextarea() {
  promptInput.style.height = 'auto';
  promptInput.style.height = `${Math.min(promptInput.scrollHeight, 180)}px`;
}

promptInput.addEventListener('input', autoSizeTextarea);
promptInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);
clearBtn.addEventListener('click', resetChat);
newChatBtn.addEventListener('click', () => {
  resetChat();
  addMessage('assistant', 'Started a fresh conversation. What would you like to work on next?');
});

resetChat();
</script>
</body>
</html>
